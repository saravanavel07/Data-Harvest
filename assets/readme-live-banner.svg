<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">DataHarvest animated dashboard banner</title>
  <desc id="desc">A futuristic animated data network with charts and live counters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071710"/><stop offset="1" stop-color="#10281d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#2e7d5b"/><stop offset=".5" stop-color="#76f0b2"/><stop offset="1" stop-color="#2e7d5b"/>
    </linearGradient>
    <radialGradient id="orb"><stop stop-color="#76f0b2" stop-opacity=".45"/><stop offset="1" stop-color="#76f0b2" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.4" opacity=".72">
    <path d="M40 190 C180 70 260 220 420 130 S650 40 790 145 S1010 210 1160 95"/>
    <path d="M70 75 C220 200 330 45 470 155 S690 225 830 100 S1030 35 1130 155"/>
    <path d="M190 220 C280 120 350 75 470 155 S650 210 790 145 S930 80 1080 95"/>
  </g>
  <g fill="url(#orb)"><circle cx="420" cy="130" r="38"/><circle cx="790" cy="145" r="42"/><circle cx="1080" cy="95" r="34"/></g>
  <g fill="#a2ffd0" filter="url(#glow)">
    <circle r="3"><animateMotion dur="6s" repeatCount="indefinite" path="M40 190 C180 70 260 220 420 130 S650 40 790 145 S1010 210 1160 95"/></circle>
    <circle r="2.5"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M70 75 C220 200 330 45 470 155 S690 225 830 100 S1030 35 1130 155"/></circle>
  </g>
  <g transform="translate(55 48)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="520" height="164" rx="18" fill="#0d2017" stroke="#315b48"/>
    <circle cx="28" cy="28" r="5" fill="#76f0b2"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="44" y="34" fill="#dffbef" font-size="20" font-weight="700">DATAHARVEST</text>
    <text x="28" y="76" fill="#76f0b2" font-size="30" font-weight="700">Turn data into decisions.</text>
    <g transform="translate(28 102)">
      <rect x="0" y="0" width="330" height="8" rx="4" fill="#1a382a"/><rect width="0" height="8" rx="4" fill="#76f0b2"><animate attributeName="width" values="0;330;330" keyTimes="0;.75;1" dur="4s" repeatCount="indefinite"/></rect>
      <text x="0" y="38" fill="#9ebdaf" font-size="13">LIVE ANALYTICS WORKSPACE</text>
    </g>
  </g>
  <g transform="translate(820 55)" font-family="Inter,Segoe UI,sans-serif">
    <rect width="300" height="150" rx="18" fill="#0d2017" stroke="#315b48"/>
    <text x="24" y="36" fill="#9ebdaf" font-size="13">DATA QUALITY</text>
    <text x="24" y="82" fill="#dffbef" font-size="38" font-weight="700">99.2%</text>
    <polyline points="24,118 66,108 108,112 150,78 192,92 234,58 276,68" fill="none" stroke="#76f0b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 400;400 400" dur="3s" repeatCount="indefinite"/>
    </polyline>
  </g>
  <g fill="#76f0b2" opacity=".5">
    <circle cx="610" cy="55" r="1.5"><animate attributeName="cy" values="55;200;55" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="210" r="1.2"><animate attributeName="cy" values="210;35;210" dur="9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
